<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bầu Chọn Trực Tuyến</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
        }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        .options-group { margin-top: 15px; }
        .option-item { 
            background: #f8f9fa; 
            border: 2px solid #eee; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .option-item:hover { border-color: #007bff; background: #f1f7ff; }
        .option-item input { margin-right: 15px; transform: scale(1.2); }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px; 
        }
        button:hover { background: #0056b3; }
        #statusMessage { margin-top: 15px; text-align: center; font-weight: 600; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #ffc107; }
        
        .admin-btn { 
            position: fixed; bottom: 20px; right: 20px; background: #495057; color: white; 
            padding: 10px 15px; border-radius: 30px; font-size: 14px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 6px;
            user-select: none; transition: transform 0.2s, background 0.2s;
        }
        .admin-btn:hover { background: #212529; transform: scale(1.05); }
        
        /* KHU VỰC ĐIỀU KHIỂN CỦA ADMIN */
        #adminPanel { 
            display: none; margin-top: 25px; border-top: 3px dashed #6c757d; 
            padding-top: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px;
        }
        #adminPanel h3 { margin-top: 20px; margin-bottom: 10px; color: #212529; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        #adminPanel h3:first-child { margin-top: 0; }
        #newOptionsInput { width: 100%; height: 60px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit; resize: vertical; }
        
        /* Các bảng dữ liệu trong Admin */
        .admin-table {
            width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 14px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #dee2e6; padding: 10px; text-align: left;
        }
        .admin-table th { background-color: #e9ecef; color: #495057; }
        .progress-bar-container { background-color: #e9ecef; border-radius: 4px; height: 12px; width: 100%; overflow: hidden; margin-top: 5px; }
        .progress-bar { background-color: #28a745; height: 100%; width: 0%; transition: width 0.5s; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ Thống Bầu Chọn Trực Tuyến</h2>
    
    <div class="form-group">
        <label for="voterName">Họ và Tên người bình chọn:</label>
        <input type="text" id="voterName" placeholder="Nhập tên hoặc Mã số để định danh..." required>
    </div>

    <div class="form-group">
        <label>Chọn một trong các phương án sau:</label>
        <div class="options-group" id="optionsArea">
            <p style="color: #666; font-style: italic;">Đang tải danh sách phương án từ máy chủ đợi một tí nha</p>
        </div>
    </div>

    <button onclick="submitVote()">Gửi / Thay Đổi Bình Chọn</button>
    <div id="statusMessage"></div>

    <div id="adminPanel">
        <h3>📊 Thống Kê Kết Quả</h3>
        <div id="statResults">Đang tính toán tỉ lệ...</div>

        <h3>👥 Danh Sách Người Bình Chọn</h3>
        <div style="max-height: 200px; overflow-y: auto;">
            <table class="admin-table">
                <thead>
                    <tr><th>Người bình chọn</th><th>Lựa chọn</th></tr>
                </thead>
                <tbody id="voterListBody">
                    <tr><td colspan="2" style="text-align:center; color:#999;">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>

        <h3>⚙️ Thiết Lập Phương Án</h3>
        <label style="font-size: 13px; font-weight: normal; margin-bottom: 5px; display:block;">Các phương án cách nhau bằng <strong>dấu phẩy (,)</strong>:</label>
        <textarea id="newOptionsInput"></textarea>
        <button style="background: #28a745; margin-top: 10px; padding: 10px;" onclick="updateOptions()">Cập Nhật Cột Phương Án</button>
    </div>
</div>

<div class="admin-btn" onclick="openAdmin()">
    <span>⚙️</span> Quản lý
</div>

<script>
    // URL mới cập nhật của bạn
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxryUgSJVCKJI9zmv4QmPqeujBgKGCvxNhIubXkVPMC5OXTH_av2CoQV7nDBDEI2mU5/exec";
    
    let globalData = { options: [], votes: [] };

    // 1. Tải danh sách phương án và dữ liệu vote từ máy chủ
    async function loadOptions() {
        try {
            const response = await fetch(SCRIPT_URL);
            globalData = await response.json();
            
            const area = document.getElementById('optionsArea');
            if(globalData.options.length === 0 || (globalData.options.length === 1 && globalData.options[0] === "")) {
                area.innerHTML = "<p style='color:red;'>Chưa có phương án nào. Hãy bấm Quản lý để thêm!</p>";
                return;
            }
            
            area.innerHTML = "";
            globalData.options.forEach(opt => {
                if(opt.trim() !== "") {
                    area.innerHTML += `
                        <label class="option-item">
                            <input type="radio" name="voteOption" value="${opt}"> ${opt}
                        </label>`;
                }
            });
            document.getElementById('newOptionsInput').value = globalData.options.join(", ");
            
            // Nếu bảng điều khiển admin đang mở, cập nhật luôn dữ liệu mới
            if(document.getElementById('adminPanel').style.display === "block") {
                buildAdminDashboard();
            }
        } catch (e) {
            document.getElementById('optionsArea').innerHTML = "<p style='color:red;'>Lỗi kết nối máy chủ không thể tải dữ liệu!</p>";
        }
    }
    
    loadOptions();

    // 2. Xử lý gửi bình chọn
    function submitVote() {
        const nameInput = document.getElementById('voterName').value.trim();
        const selectedOption = document.querySelector('input[name="voteOption"]:checked');
        const statusDiv = document.getElementById('statusMessage');

        if (!nameInput) {
            statusDiv.className = "error";
            statusDiv.innerText = "Vui lòng nhập tên của bạn để định danh!";
            return;
        }
        if (!selectedOption) {
            statusDiv.className = "error";
            statusDiv.innerText = "Vui lòng chọn 1 phương án!";
            return;
        }

        statusDiv.className = "info";
        statusDiv.innerText = "Đang gửi dữ liệu lên hệ thống...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `nguoiBinhChon=${encodeURIComponent(nameInput)}&luaChon=${encodeURIComponent(selectedOption.value)}&action=vote`
        })
        .then(() => {
            statusDiv.className = "success";
            statusDiv.innerText = `Thành công! Hệ thống đã ghi nhận lựa chọn của bạn.`;
            loadOptions(); // Tải lại dữ liệu ngầm để cập nhật số liệu
        })
        .catch(error => {
            statusDiv.className = "error";
            statusDiv.innerText = "Lỗi kết nối hệ thống!";
        });
    }

    // 3. Hàm mở quyền Admin bằng mật khẩu
    function openAdmin() {
        const password = prompt("Nhập mật khẩu để truy cập quyền Admin:");
        if (password === "khang22042016") {
            document.getElementById('adminPanel').style.display = "block";
            buildAdminDashboard();
            alert("Mật khẩu chính xác. Đã hiển thị bảng thống kê!");
        } else if (password !== null) {
            alert("Sai mật khẩu! Bạn không có quyền truy cập.");
        }
    }

    // Hàm tự động xử lý và render biểu đồ % cùng danh sách người bầu chọn
    function buildAdminDashboard() {
        const totalVotes = globalData.votes.length;
        
        // --- Tính toán tỉ lệ phần trăm ---
        let countMap = {};
        globalData.options.forEach(opt => countMap[opt] = 0);
        globalData.votes.forEach(v => {
            if (countMap[v.choice] !== undefined) countMap[v.choice]++;
        });

        let statHTML = `<p><strong>Tổng số phiếu hiện tại:</strong> ${totalVotes} phiếu</p>`;
        globalData.options.forEach(opt => {
            const count = countMap[opt] || 0;
            const percent = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : 0;
            statHTML += `
                <div style="margin-bottom: 12px;">
                    <div style="display:flex; justify-content:space-between; font-size:14px;">
                        <span><strong>${opt}</strong></span>
                        <span>${count} phiếu (${percent}%)</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${percent}%;"></div>
                    </div>
                </div>`;
        });
        document.getElementById('statResults').innerHTML = statHTML;

        // --- Tạo bảng danh sách chi tiết ---
        const tbody = document.getElementById('voterListBody');
        if (globalData.votes.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#999;">Chưa có ai bình chọn</td></tr>`;
        } else {
            tbody.innerHTML = globalData.votes.map(v => `
                <tr>
                    <td><strong>${v.name}</strong></td>
                    <td><span style="color:#007bff; font-weight:600;">${v.choice}</span></td>
                </tr>
            `).join('');
        }
    }

    // 4. Admin cập nhật phương án mới
    function updateOptions() {
        const dataInput = document.getElementById('newOptionsInput').value.trim();
        if (!confirm("Bạn có chắc chắn muốn thay đổi toàn bộ danh sách phương án không?")) return;

        const statusDiv = document.getElementById('statusMessage');
        statusDiv.className = "info";
        statusDiv.innerText = "Admin đang cập nhật phương án...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `data=${encodeURIComponent(dataInput)}&action=updateOptions`
        })
        .then(() => {
            alert("Cập nhật thành công! Trang web đang tải lại dữ liệu.");
            location.reload();
        })
        .catch(error => {
            alert("Lỗi khi cập nhật!");
        });
    }
</script>

</body>
</html>
